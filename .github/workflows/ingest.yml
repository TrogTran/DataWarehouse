name: Ingest diabetes.csv to BigQuery (Bronze)

on:
  workflow_dispatch:

jobs:
  ingest:
    name: Load raw data -> diabetes-pipeline-511509.bronze.diabetes_raw
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --no-cache-dir pandas google-cloud-bigquery db-dtypes

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Run src/ingest.py
        env:
          GCP_PROJECT_ID: "diabetes-pipeline-511509"
          CSV_PATH: data/diabetes.csv
        run: python src/ingest.py

      - name: Show run summary
        if: always()
        run: echo "Ingest finished at $(date -u) with status ${{ job.status }}"
